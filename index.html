<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0218" />
    <meta
      name="description"
      content="Synthwave Racer 3D — an endless low-poly neon highway racer with a procedural synth soundtrack."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Synthwave Racer 3D</title>
  </head>
  <body>
    <canvas id="game" aria-label="Synthwave Racer 3D game view"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-left">
        <div class="hud-label">Score</div>
        <div id="score" class="hud-value">0</div>
        <div class="hud-sub">Best <span id="best">0</span></div>
      </div>
      <div class="hud-right">
        <div id="multiplier" class="hud-mult">x1.0</div>
        <div class="hud-speed"><span id="speed">0</span><small>km/h</small></div>
      </div>
      <div class="boost-wrap">
        <div class="boost-label">Turbo</div>
        <div class="boost-bar"><div id="boost-fill"></div></div>
      </div>
    </div>

    <div class="top-buttons">
      <button id="btn-pause" class="icon-btn hidden" aria-label="Pause">II</button>
      <button id="btn-mute" class="icon-btn" aria-label="Toggle sound">♪</button>
    </div>

    <div id="touch-controls" class="hidden">
      <button id="btn-left" class="touch-btn" aria-label="Steer left">◀</button>
      <button id="btn-boost" class="touch-btn boost" aria-label="Turbo boost">TURBO</button>
      <button id="btn-right" class="touch-btn" aria-label="Steer right">▶</button>
    </div>

    <div id="overlay-start" class="overlay">
      <h1 class="title"><span>Synthwave</span><em>Racer 3D</em></h1>
      <p class="tagline">Endless neon highway. Don't crash.</p>
      <button id="btn-start" class="neon-btn">Start Engine</button>
      <div class="best-line">High score <span id="best-start">0</span></div>
      <ul class="help">
        <li><b>← → / A D</b> steer</li>
        <li><b>↑ / W / Space</b> turbo</li>
        <li><b>↓ / S</b> brake</li>
        <li><b>P</b> pause · <b>M</b> mute</li>
        <li class="touch-only"><b>Swipe</b> to change lane, <b>swipe up</b> for turbo</li>
      </ul>
    </div>

    <div id="overlay-pause" class="overlay hidden">
      <h2 class="subtitle">Paused</h2>
      <button id="btn-resume" class="neon-btn">Resume</button>
    </div>

    <div id="overlay-over" class="overlay hidden">
      <h2 class="subtitle crash">Wrecked</h2>
      <div class="final">
        <div class="hud-label">Score</div>
        <div id="final-score" class="final-score">0</div>
        <div id="new-best" class="new-best hidden">New high score!</div>
        <div class="best-line">High score <span id="best-over">0</span></div>
      </div>
      <button id="btn-restart" class="neon-btn">Race Again</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
